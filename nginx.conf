server {
    listen 8080; # Cloud Run expects port 8080 by default
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml font/woff2 application/javascript;

    # SPA Routing: Redirect 404s to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching strategies for static assets (React Vite output includes hashes)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
